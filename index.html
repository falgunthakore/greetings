<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#10132d" />
<title>Happy Birthday Mimansa</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Manrope:wght@400;600;700&display=swap');
:root{--night:#10132d;--pink:#ffb8d5;--cream:#fff0d0;--lilac:#d4bcff;--green:#5b9a78}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;}body{overflow:hidden;background:var(--night);color:#fff;font-family:Manrope,system-ui,sans-serif}
.scene{position:relative;isolation:isolate;width:100%;height:100%;min-height:520px;overflow:hidden;background:radial-gradient(ellipse at 50% 65%,rgba(116,75,140,.34),transparent 42%),radial-gradient(ellipse at 18% 20%,rgba(77,106,173,.2),transparent 35%),linear-gradient(180deg,#0a1028 0%,#171735 58%,#2b1d3b 100%)}
.scene:after{content:"";position:absolute;inset:auto -10% -18%;height:37%;border-radius:50% 50% 0 0;background:radial-gradient(ellipse at 50% 0,rgba(255,174,214,.12),transparent 65%);filter:blur(16px);z-index:-1}
.moon{position:absolute;right:12%;top:8%;width:clamp(35px,6vw,65px);aspect-ratio:1;border-radius:50%;background:#fff1d2;box-shadow:0 0 28px #ffe7c455,0 0 90px #ffe7c422;animation:moonIn 1s ease-out both}
.stars{position:absolute;inset:0;pointer-events:none}.star{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff7e8;box-shadow:0 0 8px 2px #fff3d855;animation:twinkle var(--d,3s) var(--delay,0s) ease-in-out infinite}.star.big{width:3px;height:3px}
.shooting{position:absolute;left:-20%;top:19%;width:120px;height:1px;opacity:0;background:linear-gradient(90deg,transparent,#fff,transparent);transform:rotate(-24deg);animation:shoot 1.2s 1.3s ease-out forwards}
.greeting{position:absolute;z-index:10;top:7%;left:50%;width:94%;transform:translateX(-50%);text-align:center;animation:hello .8s ease-out both}
.greeting h1{margin:0;font-family:'DM Serif Display',Georgia,serif;font-weight:400;font-size:clamp(2.45rem,7.5vw,5.8rem);line-height:1.04;letter-spacing:-.035em;color:#fff2f7;text-shadow:0 0 26px #ffb5d933,0 4px 25px #07091d88}
.greeting h1 span{display:inline-block;background:linear-gradient(100deg,#fff0d0,#ffc0df 42%,#d8c8ff 76%,#fff0d0);background-size:200% auto;color:transparent;background-clip:text;-webkit-background-clip:text;animation:shimmer 5s 1s linear infinite}
.sub{margin:.55rem 0 0;font-size:clamp(.7rem,1.9vw,.95rem);letter-spacing:.18em;text-transform:uppercase;color:#f8d8e9b8;animation:subIn .8s .25s both}
.bouquet-wrap{position:absolute;z-index:3;left:50%;top:51%;width:min(94vw,680px);height:min(76vh,680px);min-height:370px;transform:translate(-50%,-43%);overflow:visible}
.bouquet{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 18px 26px #07091d45)}
.flower-arrive{opacity:0;transform-box:fill-box;transform-origin:center;animation:arrive .85s cubic-bezier(.16,.8,.25,1) var(--delay,0s) forwards}
.stemline{fill:none;stroke:#5d9b79;stroke-width:5;stroke-linecap:round;stroke-dasharray:260;stroke-dashoffset:260;animation:drawStem 1.1s .35s ease-out forwards}
.leaf{fill:#6cb087;stroke:#8bc99b;stroke-width:1.3;transform-box:fill-box;transform-origin:center;opacity:0;animation:leafPop .5s .8s ease-out forwards}
.petal{stroke:#fff5f0;stroke-opacity:.4;stroke-width:1.2}
.paper-back{opacity:0;transform-origin:350px 470px;animation:paperIn .8s 3.5s cubic-bezier(.2,.8,.2,1) forwards}
.paper-front{opacity:0;transform-origin:350px 475px;animation:paperIn .8s 3.85s cubic-bezier(.2,.8,.2,1) forwards}
.paper-fold{opacity:0;animation:foldIn .65s 4.15s ease-out forwards}
.ribbon{opacity:0;transform-origin:350px 487px;animation:bowIn .75s 5.05s cubic-bezier(.2,.9,.25,1) forwards}
.heart-glow{opacity:0;animation:heartGlow 2.2s 6s ease-in-out infinite}
.sparkle{opacity:0;transform-box:fill-box;transform-origin:center;animation:sparkle 2s var(--delay,0s) ease-in-out infinite}
.final-caption{position:absolute;z-index:9;bottom:3.4%;left:50%;width:92%;text-align:center;transform:translateX(-50%);font-family:'DM Serif Display',Georgia,serif;font-size:clamp(1rem,2.5vw,1.45rem);font-style:italic;color:#ffe7f1;letter-spacing:.025em;text-shadow:0 0 18px #ffb8d544;opacity:0;animation:captionIn 1s 6.35s ease-out forwards}
@keyframes hello{from{opacity:0;transform:translate(-50%,-12px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes subIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes moonIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
@keyframes twinkle{0%,100%{opacity:.22;transform:scale(.7)}50%{opacity:1;transform:scale(1.35)}}
@keyframes shoot{0%{opacity:0;left:-20%;top:19%}12%{opacity:1}100%{opacity:0;left:120%;top:1%}}
@keyframes arrive{0%{opacity:0;transform:translate(var(--x,0),var(--y,35px)) scale(.55) rotate(var(--r,-10deg))}70%{opacity:1;transform:translate(0,-5px) scale(1.04) rotate(2deg)}100%{opacity:1;transform:translate(0,0) scale(1) rotate(0)}}
@keyframes drawStem{to{stroke-dashoffset:0}}
@keyframes leafPop{from{opacity:0;transform:scale(.2) rotate(-20deg)}to{opacity:1;transform:scale(1) rotate(0)}}
@keyframes paperIn{0%{opacity:0;transform:translateY(55px) scale(.72,.82)}70%{opacity:1;transform:translateY(-4px) scale(1.02,1.02)}100%{opacity:1;transform:translateY(0) scale(1)}}
@keyframes foldIn{from{opacity:0;transform:translateY(15px) scale(.9)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes bowIn{0%{opacity:0;transform:scale(.15) rotate(-18deg)}65%{opacity:1;transform:scale(1.1) rotate(4deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
@keyframes heartGlow{0%,100%{opacity:.35}50%{opacity:.95}}
@keyframes sparkle{0%,100%{opacity:0;transform:scale(.4) rotate(0)}35%,65%{opacity:1;transform:scale(1.2) rotate(45deg)}}
@keyframes captionIn{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes shimmer{to{background-position:200% center}}
@keyframes sway{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.2deg)}}
@media(max-width:520px){.greeting{top:6%}.bouquet-wrap{top:51%;width:112vw;height:70vh;min-height:340px}.final-caption{bottom:4%;font-size:1.02rem}.sub{letter-spacing:.12em}.moon{right:8%;top:15%}}
@media(max-height:650px){.greeting{top:3%}.greeting h1{font-size:clamp(2rem,6vw,4rem)}.bouquet-wrap{top:52%;height:72vh}.final-caption{bottom:1.5%}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<main class="scene" aria-label="A birthday bouquet being assembled for Mimansa">
  <div class="stars" id="stars" aria-hidden="true"></div><div class="moon" aria-hidden="true"></div><div class="shooting" aria-hidden="true"></div>
  <header class="greeting"><h1><span>Happy Birthday</span><br>Mimansa</h1><p class="sub">A little bouquet, just for you</p></header>
  <div class="bouquet-wrap">
  <svg class="bouquet" viewBox="0 0 700 700" role="img" aria-label="Pastel flowers gathering into a bouquet, wrapped in pink paper and tied with a heart-shaped bow">
    <defs>
      <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe0e9"/><stop offset=".48" stop-color="#f8b8d0"/><stop offset="1" stop-color="#c987b2"/></linearGradient>
      <linearGradient id="paperLight" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff0e7"/><stop offset="1" stop-color="#f4b6d0"/></linearGradient>
      <linearGradient id="ribbonGrad" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffdeeb"/><stop offset=".5" stop-color="#f58fbd"/><stop offset="1" stop-color="#d95e9b"/></linearGradient>
      <radialGradient id="rosePink"><stop stop-color="#ffe4ed"/><stop offset=".55" stop-color="#ff9fc6"/><stop offset="1" stop-color="#df6099"/></radialGradient>
      <radialGradient id="rosePeach"><stop stop-color="#fff1d5"/><stop offset=".58" stop-color="#ffbe9f"/><stop offset="1" stop-color="#e9818b"/></radialGradient>
      <radialGradient id="lilac"><stop stop-color="#fff0ff"/><stop offset=".55" stop-color="#d9b9ff"/><stop offset="1" stop-color="#9d77d5"/></radialGradient>
      <radialGradient id="daisy"><stop stop-color="#ffce78"/><stop offset="1" stop-color="#e9953d"/></radialGradient>
      <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="7"/></filter>
      <g id="roseHead">
        <g class="petal" fill="url(#rosePink)"><ellipse cy="-25" rx="13" ry="23"/><ellipse transform="rotate(45)" cy="-25" rx="13" ry="23"/><ellipse transform="rotate(90)" cy="-25" rx="13" ry="23"/><ellipse transform="rotate(135)" cy="-25" rx="13" ry="23"/><ellipse transform="rotate(180)" cy="-25" rx="13" ry="23"/><ellipse transform="rotate(225)" cy="-25" rx="13" ry="23"/><ellipse transform="rotate(270)" cy="-25" rx="13" ry="23"/><ellipse transform="rotate(315)" cy="-25" rx="13" ry="23"/></g><circle r="18" fill="#ffb6d3"/><path d="M-11 1 Q-5 -14 5 -8 Q14 -2 4 9 Q-6 15 -11 1Z" fill="#f37dad"/><path d="M-5 -3 Q2 -12 8 -3 Q4 5 -2 6Z" fill="#ffe0eb"/>
      </g>
      <g id="peachRose"><g fill="url(#rosePeach)" stroke="#fff2df" stroke-opacity=".45" stroke-width="1.2"><ellipse cy="-23" rx="12" ry="21"/><ellipse transform="rotate(45)" cy="-23" rx="12" ry="21"/><ellipse transform="rotate(90)" cy="-23" rx="12" ry="21"/><ellipse transform="rotate(135)" cy="-23" rx="12" ry="21"/><ellipse transform="rotate(180)" cy="-23" rx="12" ry="21"/><ellipse transform="rotate(225)" cy="-23" rx="12" ry="21"/><ellipse transform="rotate(270)" cy="-23" rx="12" ry="21"/><ellipse transform="rotate(315)" cy="-23" rx="12" ry="21"/></g><circle r="16" fill="#ffccaa"/><path d="M-9 1 Q-2 -11 6 -5 Q13 2 2 9 Q-7 11 -9 1Z" fill="#f28c88"/></g>
      <g id="daisyHead"><g fill="#fff2e8" stroke="#fffcf5" stroke-width="1"><ellipse cy="-20" rx="7" ry="16"/><ellipse transform="rotate(30)" cy="-20" rx="7" ry="16"/><ellipse transform="rotate(60)" cy="-20" rx="7" ry="16"/><ellipse transform="rotate(90)" cy="-20" rx="7" ry="16"/><ellipse transform="rotate(120)" cy="-20" rx="7" ry="16"/><ellipse transform="rotate(150)" cy="-20" rx="7" ry="16"/><ellipse transform="rotate(180)" cy="-20" rx="7" ry="16"/><ellipse transform="rotate(210)" cy="-20" rx="7" ry="16"/><ellipse transform="rotate(240)" cy="-20" rx="7" ry="16"/><ellipse transform="rotate(270)" cy="-20" rx="7" ry="16"/><ellipse transform="rotate(300)" cy="-20" rx="7" ry="16"/><ellipse transform="rotate(330)" cy="-20" rx="7" ry="16"/></g><circle r="12" fill="url(#daisy)"/><circle r="5" fill="#ffed9b"/></g>
      <g id="tulip"><path d="M-22 4 Q-27 -22 -12 -31 Q-8 -17 0 -35 Q9 -19 14 -31 Q28 -15 21 5 Q12 20 0 15 Q-14 18 -22 4Z" fill="url(#rosePink)" stroke="#ffe5ef" stroke-opacity=".5" stroke-width="1.5"/><path d="M0 13 Q-3 -5 -12 -27 Q1 -18 3 -3 Q7 -20 14 -26 Q7 -5 0 13Z" fill="#ffe2ed" opacity=".8"/></g>
      <g id="lavenderSprig" stroke="#9a80c6" stroke-width="2" stroke-linecap="round"><path d="M0 0 Q-1 -40 4 -74" fill="none" stroke="#679b7a" stroke-width="3"/><g fill="#c7a8f3" stroke="#e5d5ff" stroke-width=".7"><ellipse cx="-5" cy="-61" rx="5" ry="9"/><ellipse cx="8" cy="-54" rx="5" ry="9"/><ellipse cx="-6" cy="-46" rx="5" ry="9"/><ellipse cx="9" cy="-39" rx="5" ry="9"/><ellipse cx="-3" cy="-31" rx="5" ry="8"/><ellipse cx="5" cy="-68" rx="5" ry="8"/></g></g>
    </defs>
    <!-- stems arrive first, followed by each flower head -->
    <g class="flower-arrive" style="--delay:.1s;--x:-150px;--y:25px"><path class="stemline" d="M347 485 Q285 390 185 270"/><path class="leaf" d="M278 397 Q239 359 231 389 Q247 411 278 397Z"/><path class="leaf" d="M301 425 Q337 389 346 418 Q330 439 301 425Z"/></g>
    <g class="flower-arrive" style="--delay:.45s;--x:150px;--y:25px"><path class="stemline" d="M352 486 Q419 385 516 274"/><path class="leaf" d="M415 397 Q452 362 463 391 Q446 413 415 397Z"/><path class="leaf" d="M390 431 Q354 396 346 425 Q364 444 390 431Z"/></g>
    <g class="flower-arrive" style="--delay:.65s;--x:-100px;--y:55px"><path class="stemline" d="M344 485 Q300 378 291 221"/><path class="leaf" d="M315 390 Q279 365 274 391 Q291 408 315 390Z"/></g>
    <g class="flower-arrive" style="--delay:.85s;--x:100px;--y:55px"><path class="stemline" d="M356 485 Q398 375 411 215"/><path class="leaf" d="M384 390 Q420 360 426 389 Q409 409 384 390Z"/></g>
    <g class="flower-arrive" style="--delay:1.05s;--x:0px;--y:70px"><path class="stemline" d="M350 492 Q349 370 350 175"/><path class="leaf" d="M350 393 Q311 365 307 391 Q327 411 350 393Z"/><path class="leaf" d="M353 355 Q389 326 396 352 Q379 375 353 355Z"/></g>
    <g class="flower-arrive" style="--delay:.15s;--x:-190px;--y:-20px"><g transform="translate(185 263) scale(1.03)"><use href="#daisyHead"/></g></g>
    <g class="flower-arrive" style="--delay:.4s;--x:190px;--y:-20px"><g transform="translate(516 267) scale(1.05)"><use href="#peachRose"/></g></g>
    <g class="flower-arrive" style="--delay:.65s;--x:-120px;--y:-40px"><g transform="translate(290 214) scale(1.08)"><use href="#tulip"/></g></g>
    <g class="flower-arrive" style="--delay:.85s;--x:120px;--y:-40px"><g transform="translate(412 209) scale(1.02)"><use href="#daisyHead"/></g></g>
    <g class="flower-arrive" style="--delay:1.05s;--x:0px;--y:-70px"><g transform="translate(350 169) scale(1.23)"><use href="#roseHead"/></g></g>
    <g class="flower-arrive" style="--delay:1.2s;--x:-65px;--y:0px"><g transform="translate(240 320) scale(.78)"><use href="#lavenderSprig"/></g><g transform="translate(464 327) scale(.83)"><use href="#lavenderSprig"/></g></g>
    <g class="flower-arrive" style="--delay:1.35s;--x:50px;--y:20px"><g transform="translate(338 278) scale(.72)"><use href="#peachRose"/></g></g>
    <g class="flower-arrive" style="--delay:1.4s;--x:-80px;--y:20px"><g transform="translate(235 300) rotate(-12) scale(.72)"><use href="#roseHead"/></g></g>
    <g class="flower-arrive" style="--delay:1.45s;--x:75px;--y:15px"><g transform="translate(467 300) rotate(10) scale(.72)"><use href="#daisyHead"/></g></g>
    <g class="flower-arrive" style="--delay:1.5s;--x:-35px;--y:15px"><g transform="translate(275 265) rotate(-8) scale(.76)"><use href="#peachRose"/></g></g>
    <g class="flower-arrive" style="--delay:1.55s;--x:35px;--y:15px"><g transform="translate(430 260) rotate(8) scale(.78)"><use href="#tulip"/></g></g>
    <g class="flower-arrive" style="--delay:1.6s;--x:-45px;--y:10px"><g transform="translate(305 315) rotate(-10) scale(.62)"><use href="#daisyHead"/></g></g>
    <g class="flower-arrive" style="--delay:1.65s;--x:45px;--y:10px"><g transform="translate(395 315) rotate(10) scale(.64)"><use href="#roseHead"/></g></g>
    <g class="flower-arrive" style="--delay:1.7s;--x:-25px;--y:5px"><g transform="translate(258 345) rotate(-15) scale(.58)"><use href="#tulip"/></g></g>
    <g class="flower-arrive" style="--delay:1.75s;--x:25px;--y:5px"><g transform="translate(445 342) rotate(12) scale(.6)"><use href="#peachRose"/></g></g>
    <!-- paper panels wrap the lower stems -->
    <g class="paper-back"><path d="M214 388 Q350 429 486 388 L420 589 Q350 623 280 589Z" fill="url(#paper)" stroke="#ffd8e6" stroke-width="2"/><path d="M214 388 L350 462 L280 589Z" fill="#ffe5ec" opacity=".75"/><path d="M486 388 L350 462 L420 589Z" fill="#b975a5" opacity=".48"/></g>
    <g class="paper-front"><path d="M248 408 Q350 455 452 408 L405 594 Q350 619 295 594Z" fill="url(#paperLight)" stroke="#fff0f2" stroke-width="2"/><path d="M248 408 L350 476 L295 594Z" fill="#fff2ed" opacity=".8"/><path d="M452 408 L350 476 L405 594Z" fill="#e7a0c3" opacity=".65"/></g>
    <g class="paper-fold"><path d="M248 408 Q350 458 452 408 L432 438 Q350 481 268 438Z" fill="#ffd5e5" stroke="#fff0f3" stroke-width="1.5"/><path d="M350 476 L350 611" fill="none" stroke="#d88bb2" stroke-opacity=".5" stroke-width="2"/></g>
    <!-- The ribbon loops themselves form a heart -->
    <g class="ribbon">
      <ellipse class="heart-glow" cx="350" cy="486" rx="76" ry="54" fill="#ff9fcf" filter="url(#softGlow)"/>
      <path d="M350 488 C330 470 285 444 282 477 C279 505 322 523 350 541 C378 523 421 505 418 477 C415 444 370 470 350 488Z" fill="none" stroke="#bf5a91" stroke-width="22" stroke-linejoin="round" opacity=".7"/>
      <path d="M350 488 C330 470 285 444 282 477 C279 505 322 523 350 541 C378 523 421 505 418 477 C415 444 370 470 350 488Z" fill="none" stroke="url(#ribbonGrad)" stroke-width="15" stroke-linejoin="round"/>
      <path d="M344 497 Q318 531 302 564 Q333 555 351 516Z" fill="url(#ribbonGrad)" stroke="#ffd7e7" stroke-width="1.5"/>
      <path d="M356 497 Q381 530 402 560 Q371 555 350 516Z" fill="url(#ribbonGrad)" stroke="#ffd7e7" stroke-width="1.5"/>
      <path d="M345 488 Q350 481 356 488 L364 499 Q350 512 336 499Z" fill="#ffdeeb" stroke="#d66a9e" stroke-width="2"/>
      <path d="M350 488 C330 470 285 444 282 477 C279 505 322 523 350 541 C378 523 421 505 418 477 C415 444 370 470 350 488Z" fill="none" stroke="#fff4f7" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="2 7" opacity=".85"/>
    </g>
    <!-- tiny twinkles around the finished bouquet -->
    <g fill="#fff2c8"><path class="sparkle" style="--delay:6.1s" d="M160 370 l4 11 11 4 -11 4 -4 11 -4 -11 -11 -4 11 -4Z"/><path class="sparkle" style="--delay:6.5s" d="M520 360 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3Z"/><path class="sparkle" style="--delay:6.8s" d="M468 220 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3Z"/><circle class="sparkle" style="--delay:6.3s" cx="211" cy="310" r="3"/><circle class="sparkle" style="--delay:7s" cx="492" cy="300" r="2.5"/></g>
  </svg>
  </div>
  // <div class="final-caption">Made with a little extra love ♡</div>
</main>
<script>
(() => {
  const sky = document.getElementById('stars');
  const count = window.matchMedia('(max-width: 520px)').matches ? 42 : 68;
  for (let i = 0; i < count; i++) {
    const star = document.createElement('i');
    star.className = 'star' + (i % 9 === 0 ? ' big' : '');
    star.style.left = (Math.random() * 100) + '%';
    star.style.top = (Math.random() * 100) + '%';
    star.style.setProperty('--d', (2 + Math.random() * 3.5) + 's');
    star.style.setProperty('--delay', (-Math.random() * 5) + 's');
    sky.appendChild(star);
  }
})();
</script>
</body>
</html>
